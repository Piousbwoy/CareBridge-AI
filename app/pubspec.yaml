name: carebridge_ai
description: "CareBridge AI - Predictive Risk Triage & CHPS Frontline Health Assistant"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.1.0
  intl: ^0.20.2
  # Local storage — Drift ORM + SQLCipher encryption
  drift: ^2.14.0
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.2
  path: ^1.9.0
  # Security — SQLCipher passphrase stored in Android Keystore, NEVER as a string literal
  flutter_secure_storage: ^9.0.0
  # Audio — pre-recorded Dagbani prompts (bundled, no connectivity dependency)
  audioplayers: ^6.0.0
  # Networking — sync when online, offline-first
  http: ^1.2.0
  connectivity_plus: ^5.0.2
  # State
  provider: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.14.0
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    # Pre-recorded Dagbani local-language audio prompts (offline, bundled)
    - assets/audio/muac_instruction_dagbani.mp3
    - assets/audio/oedema_check_dagbani.mp3
    - assets/audio/breathing_timer_dagbani.mp3
    - assets/audio/danger_signs_dagbani.mp3
    - assets/audio/maternal_anaemia_dagbani.mp3
    - assets/audio/fetal_movement_dagbani.mp3
    # On-device TFLite MUAC trend classifier model
    - assets/models/muac_trend_classifier.tflite
    # Clinical rules config (JSON) for version-controlled rule definitions
    - assets/rules/imci_rules.json
    # Hero images for splash and onboarding screens
    - assets/images/
